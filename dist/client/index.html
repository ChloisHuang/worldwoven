		<script id="mobile-viewport">
			// Port src/resident-panel.css and src/viewport.js: a portrait phone

			const mobileViewport = (() => {

					logicalWidth = rotated ? availableHeight : availableWidth;
					logicalHeight = rotated ? availableWidth : availableHeight;
					surface.style.width = logicalWidth + 'px';
					surface.style.height = logicalHeight + 'px';
					surface.style.left = ((viewport ? viewport.offsetLeft : 0) + left + (rotated ? availableWidth : 0)) + 'px';
					surface.style.top = ((viewport ? viewport.offsetTop : 0) + top) + 'px';
					surface.style.transform = rotated ? 'rotate(90deg)' : 'none';
					canvas.style.width = logicalWidth + 'px';
					canvas.style.height = logicalHeight + 'px';
					const ratio = window.devicePixelRatio || 1;
					const pixelsWide = Math.max(1, Math.round(logicalWidth * ratio));
					const pixelsHigh = Math.max(1, Math.round(logicalHeight * ratio));
					if (canvas.width !== pixelsWide) canvas.width = pixelsWide;
					if (canvas.height !== pixelsHigh) canvas.height = pixelsHigh;
				}
				function pointProxy(point, rect) {
					// Godot scales client coordinates using the transformed DOM rect.
					// Re-express source logical coordinates in that rect, so its normal
					// conversion yields the correct DPR-scaled game coordinates.
					const x = rect.left + (point.clientY - rect.top) * rect.width / logicalWidth;
					const y = rect.top + (rect.right - point.clientX) * rect.height / logicalHeight;

						if (key === 'clientX') return x;
						if (key === 'clientY') return y;
						if (key === 'movementX') return (target.movementY || 0) * rect.width / logicalWidth;
						if (key === 'movementY') return -(target.movementX || 0) * rect.height / logicalHeight;

						return typeof value === 'function' ? value.bind(target) : value;

							points.item = index => points[index];
							return points;
						}
						return Reflect.get(target, key);

					const listeners = new Map();
					target.addEventListener = (type, listener, options) => {
						if (!/^(pointer|mouse|touch|wheel)/.test(type) || typeof listener !== 'function') return add(type, listener, options);
						let wrapped = listeners.get(listener);
						if (!wrapped) {
							wrapped = event => {
								if (event.type === 'pointerdown' && event.target === canvas) activePointers.add(event.pointerId);
								if (event.type === 'mousedown' && event.target === canvas) activeMouseButtons.add(event.button);
								const result = listener.call(target, eventProxy(event));
								if (event.type === 'pointerup' || event.type === 'pointercancel') queueMicrotask(() => activePointers.delete(event.pointerId));
								if (event.type === 'mouseup') queueMicrotask(() => activeMouseButtons.delete(event.button));
								return result;
							};
							listeners.set(listener, wrapped);
						}
						return add(type, wrapped, options);
					};

					orientationLocked = false;
				}
				function publishFullscreen() {
					document.documentElement.classList.toggle('app-fullscreen', isFullscreen());
					resize();
				}
				async function toggleFullscreen() {
					if (nativeFullscreen()) {
						await document.exitFullscreen();
						unlockOrientation();
					} else if (fallbackFullscreen) {
						fallbackFullscreen = false;
					} else if (typeof document.documentElement.requestFullscreen === 'function') {
						try {
							// Fullscreening the canvas removes its parent's rotation.
							await document.documentElement.requestFullscreen();
							if (window.innerWidth <= 760 && typeof window.screen?.orientation?.lock === 'function') {
								try { await window.screen.orientation.lock('landscape'); orientationLocked = true; } catch (_) {}
							}

					} else {
						// Same in-page fallback as the source; this cannot hide Safari chrome.
						fallbackFullscreen = true;
					}
					publishFullscreen();
					return isFullscreen();
				}
				forwardInput(canvas);
				forwardInput(window);
				window.addEventListener('resize', resize);
				window.addEventListener('blur', () => { activePointers.clear(); activeMouseButtons.clear(); });
				window.addEventListener('fullscreenchange', () => { if (!nativeFullscreen()) { fallbackFullscreen = false; unlockOrientation(); } publishFullscreen(); });

					window.visualViewport.addEventListener('resize', resize);
					window.visualViewport.addEventListener('scroll', resize);
				}
				resize();
				return {resize, isFullscreen, toggleFullscreen};
			})();
			window.ourAlienViewport = mobileViewport;

		<script>

			config.canvasResizePolicy = 0;
			const GODOT_THREADS_ENABLED = false;
			const loading = document.getElementById('loading');
			const title = document.getElementById('loading-title');
			const description = document.getElementById('loading-description');
			const progress = document.querySelector('.boot-progress');
			const fill = document.getElementById('boot-fill');
			const percent = document.getElementById('boot-percent');
			const english = !navigator.language.toLowerCase().startsWith('zh');
			// Isolate the spinner from Godot's synchronous WebGL shader compilation.
			const orbit = document.createElement('iframe');
			orbit.setAttribute('sandbox', '');
			orbit.tabIndex = -1;
			orbit.srcdoc = '<!DOCTYPE html>' + document.getElementById('loading-orbit-document').innerHTML;
			document.getElementById('loading-orbit').replaceChildren(orbit);
			if (english) {
				document.documentElement.lang = 'en';
				title.textContent = 'Landing at Lumina Bay';
				description.textContent = 'Waking residents and lighting the mushrooms for a new day...';
				progress.setAttribute('aria-label', 'Asset loading progress');
				percent.textContent = 'Assets loaded 0%';
				document.getElementById('retry-load').textContent = 'Land again';
			}
			let failed = false, initializing = false, finished = false;
			const startedAt = Date.now();
			let heartbeat = null;
			const startupError = event => fail(event.reason || event.error || event.message || 'Game startup failed');
			window.addEventListener('error', startupError);
			window.addEventListener('unhandledrejection', startupError);
			function cleanup() {
				clearInterval(heartbeat);
				window.removeEventListener('error', startupError);
				window.removeEventListener('unhandledrejection', startupError);
				window.removeEventListener('godot-asset-cache', showTransferStatus);
			}
			function showTransferStatus() {
				if (failed || finished) return;
				const stats = window.__godotAssetCache;
				if (stats?.assets?.['index.pck']?.complete && stats?.assets?.['index.wasm']?.complete) initializing = true;
				const elapsed = Math.floor((Date.now() - startedAt) / 1000);
				const stage = initializing
					? (english ? 'Assets ready · Starting engine and scene' : '资源已就绪 · 正在启动引擎与场景')
					: (english ? 'Loading and unpacking game assets' : '正在读取并解压游戏资源');
				const transfer = stats ? (english
					? `Downloaded ${(stats.networkBytes / 1000000).toFixed(1)} MB · Reused ${(stats.cacheReadBytes / 1000000).toFixed(1)} MB`
					: `本次下载 ${(stats.networkBytes / 1000000).toFixed(1)} MB · 复用缓存 ${(stats.cacheReadBytes / 1000000).toFixed(1)} MB`) : '';

				if (initializing) {

				cleanup();

				title.textContent = english ? 'Lumina Bay could not load' : '星湾暂时无法加载';
				description.textContent = error instanceof Error ? error.message : String(error);
				progress.hidden = true;
				percent.hidden = true;
				document.getElementById('retry-load').style.display = 'block';
			}
			const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
			if (missing.length) {
				fail(missing.join(', '));
			} else {
				// The decorative iframe must never hold game startup hostage.
				Promise.resolve().then(() => new Engine(config).startGame({
					onExit(code) { fail(new Error(`Game exited during startup (${code})`)); },
					onProgress(current, total) {
						if (total <= 0) return;
						const value = Math.min(100, Math.round(100 * current / total));
						initializing = initializing || current >= total;
						fill.style.transform = `scaleX(${value / 100})`;
						progress.setAttribute('aria-valuenow', value);
						percent.textContent = `${english ? 'Assets loaded ' : '已加载资源 '}${value}%`;
						showTransferStatus();
					}
				})).then(() => { if (!failed) { finished = true; cleanup(); loading.remove(); } }, fail);
			}
