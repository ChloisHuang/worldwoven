<!doctype html><meta charset="utf-8"><title>Underground market visual verification</title>
<style>html,body{margin:0;background:#202e2b;overflow:hidden}canvas{display:block}pre{display:none}</style>
<script type="importmap">{"imports":{"three":"../../source/vendor/three/build/three.module.js"}}</script>
<canvas id="view"></canvas><pre id="report"></pre>
<script type="module">
import * as T from 'three';
import * as G from '../../source/game/geometry.js';
import {buildChinaHoldingCell,holdingGroundPieces} from '../../source/game/china-holding-cell.js';
import {createCharacter} from '../../source/game/characters.js';
import {resolveCameraPosition,cameraClipPlanes} from '../../source/game/camera.js';
import {createNightLighting} from '../../source/game/night-lighting.js';
import {configureStableShadows,setStableShadowBounds,applyWorldShadowPolicy,applyCharacterShadowPolicy} from '../../source/game/stable-shadows.js';
const report={scope:'Exact production underground holding + independent market module; exact production terrain cut and top slab locally cropped. Production character rig, TPS FOV50/pitch.22/distance4.6, camera collision and world-fixed lighting. Other palace buildings and saved character appearances are excluded.',status:'RUNNING',errors:[]};
const emit=()=>document.querySelector('#report').textContent=JSON.stringify(report);
window.addEventListener('error',e=>{report.errors.push(e.message);emit();});
try{
 const renderer=new T.WebGLRenderer({canvas:document.querySelector('#view'),antialias:true,alpha:false,preserveDrawingBuffer:true});renderer.setSize(960,640,false);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NoToneMapping;
 const gl=renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info');report.renderer={three:T.REVISION,version:gl.getParameter(gl.VERSION),unmasked:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER)};
 renderer.debug.onShaderError=(g,p,v,f)=>report.errors.push({program:g.getProgramInfoLog(p),vertex:g.getShaderInfoLog(v),fragment:g.getShaderInfoLog(f)});
 const scene=new T.Scene();scene.background=new T.Color(0xc1cbc0);const hemi=new T.HemisphereLight(0xfff4d8,0x6e8a7b,.85),sun=new T.DirectionalLight(0xffedcd,1.6);scene.add(hemi,sun,sun.target);configureStableShadows(renderer,sun);
 const ctx={group:new T.Group(),roofGroup:new T.Group(),colliders:[],cameraColliders:[],walkableSurfaces:[],interiorRooms:[],levels:[],lightingZones:[],explorationTargets:[],facilities:[]};ctx.group.add(ctx.roofGroup);scene.add(ctx.group);
 const H=buildChinaHoldingCell(G,ctx),M=H.blackMarket;
 // Same exact two terrain layers and aperture as china-palace.js, cropped
 // around this isolated asset to avoid constructing unrelated whole-palace art.
 for(const b of holdingGroundPieces({minX:-28,maxX:-1,minZ:22,maxZ:39})){
  G.box(ctx.group,(b.minX+b.maxX)/2,-.5,(b.minZ+b.maxZ)/2,b.maxX-b.minX,1,b.maxZ-b.minZ,0x859b79);
  G.box(ctx.group,(b.minX+b.maxX)/2,.05,(b.minZ+b.maxZ)/2,b.maxX-b.minX,.10,b.maxZ-b.minZ,0xc4bca8);
  ctx.walkableSurfaces.push({...b,y:.115});
 }
 const views={entry:{position:[-14,.115,27.4],yaw:Math.PI,rotation:0},branch:{position:[-14,-4.1,36.15],yaw:-Math.PI/2,rotation:Math.PI/2},counter:{position:M.interaction.position,yaw:.34,rotation:Math.PI}};
 const name=new URL(location.href).searchParams.get('view')||'counter',v=views[name];if(!v)throw Error('Unknown view');
 const player=createCharacter({culture:'china',bodyPreset:'feminine-balanced',wardrobePreset:'hanfu-ruqun'});player.root.position.set(...v.position);player.root.rotation.y=v.rotation;ctx.group.add(player.root);player.animate(1,false,null);applyCharacterShadowPolicy(player.root);
 const merchant=createCharacter({culture:'china',bodyPreset:'masculine-balanced',wardrobePreset:'scholar-tunic-trousers'});merchant.root.position.set(...M.merchant.position);merchant.root.rotation.y=M.merchant.rotation;ctx.group.add(merchant.root);merchant.animate(1,false,null);applyCharacterShadowPolicy(merchant.root);
 applyWorldShadowPolicy(ctx.group);applyCharacterShadowPolicy(player.root);applyCharacterShadowPolicy(merchant.root);setStableShadowBounds(sun,new T.Box3().setFromObject(ctx.group));
 const lighting=createNightLighting({scene,hemi,sun});lighting.attach(ctx,'china');lighting.setNight(false);lighting.update();
 const target=player.root.position.clone().add(new T.Vector3(0,1.45,0)),desired=target.clone().add(new T.Vector3(Math.sin(v.yaw)*Math.cos(.22)*4.6,Math.sin(.22)*4.6,Math.cos(v.yaw)*Math.cos(.22)*4.6)),camera=new T.PerspectiveCamera(50,960/640,.1,150);
 camera.position.copy(resolveCameraPosition(target,desired,ctx.cameraColliders,.18));camera.lookAt(target);player.root.visible=camera.position.distanceTo(target)>.8;const clip=cameraClipPlanes({cameraDistance:camera.position.distanceTo(target)});camera.near=clip.near;camera.far=clip.far;camera.updateProjectionMatrix();scene.updateMatrixWorld(true);
 renderer.render(scene,camera);gl.finish();report.glError=gl.getError();report.view=name;report.camera=camera.position.toArray();report.target=target.toArray();report.cameraDistance=camera.position.distanceTo(target);report.drawCalls=renderer.info.render.calls;report.triangles=renderer.info.render.triangles;report.fixtureCount=lighting.getDebug().fixtureCount;report.status=report.errors.length||report.glError?'FAIL':'RENDERED_PENDING_VISUAL_REVIEW';emit();
}catch(error){report.status='FAIL';report.errors.push(error.stack||String(error));emit();document.body.style.background='#762323';}
</script>
