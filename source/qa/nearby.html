<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <title>近场交互 · 候选 UI 审图</title>
 <script>if(new URLSearchParams(location.search).get('frame')==='1')document.documentElement.dataset.nearbyFrame='true';</script>
 <link id="product-style" rel="stylesheet" href="./nearby-candidate/game.css" media="not all">
 <script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js"}}</script>
 <style>
 html:not([data-nearby-frame]){font-family:system-ui,sans-serif;color:#2e4c4a;background:#eef2e9}
 html:not([data-nearby-frame]) body{margin:20px}
 .review-shell{max-width:1100px}.review-shell h1{font-size:22px;margin:0 0 12px}.review-shell p{max-width:940px;line-height:1.6}
 .review-shell label{display:inline-flex;align-items:center;gap:8px;margin:0 12px 10px 0}.review-shell select,.review-shell button{font:inherit;min-height:44px}
 .review-shell .frame-scroll{overflow:auto;max-width:100%;border:1px solid #78928d;background:#233d42;width:854px}
 #nearby-frame{display:block;width:852px;height:393px;border:0;max-width:none}
 #nearby-result{white-space:pre-wrap;font-size:12px;line-height:1.5;max-height:360px;overflow:auto}
 .review-caption{font-size:13px;color:#526c66}.review-status{font-size:13px;padding:8px 12px;background:#dfe9db}
 html[data-nearby-frame] .review-shell{display:none}
 html[data-nearby-frame] body{background:#17353c}
 #nearby-background{position:fixed;inset:0;width:852px;height:393px;display:block;pointer-events:none;user-select:none}
 #nearby-scope{position:fixed;left:12px;bottom:8px;z-index:30;max-width:calc(100vw - 24px);padding:3px 7px;background:#143439d9;color:#fffdf1;font:10px/1.4 system-ui;pointer-events:none}
 #nearby-error{position:fixed;inset:20px;z-index:100;background:#fff2e7;padding:16px;color:#763b2a;white-space:pre-wrap;overflow:auto}
 </style>
</head>
<body>
 <main class="review-shell">
  <h1>近场交互 · 候选 UI 审图</h1>
  <p>非实机：Mesa 正常游玩镜头背景 + 当前真实产品 DOM/CSS。目标坐标取自同一帧真实相机投影；业务只使用内存夹具，点击仅记录选择，不读取或写入游戏存档，不创建订单或改变关系。</p>
  <label for="nearby-case">状态 <select id="nearby-case"><option value="cn-nearby">中国 · 柜台与许安</option><option value="cn-menu">中国 · 柜台五项菜单</option><option value="jp-nearby">日本 · 拉面吧台</option><option value="conversation">许安 · 本地交谈话题</option><option value="wallet">钱包 · 滚动与前往银行</option></select></label>
  <button id="nearby-reload" type="button">重新打开本状态</button>
  <button id="nearby-measure" type="button">测量当前布局</button>
  <p class="review-caption" id="nearby-caption"></p>
  <div class="frame-scroll"><iframe id="nearby-frame" width="852" height="393" title="852×393 近场候选 UI，非实机 Mesa 背景与真实 DOM"></iframe></div>
  <p class="review-status" id="nearby-status" aria-live="polite">等待画面…</p>
  <details><summary>投影、按钮与本次选择记录</summary><pre id="nearby-result"></pre></details>
 </main>
 <template id="nearby-hud-template"><header class="topbar"><a href="/" class="hub-link" aria-label="四方生活首页">✧ <span>四方</span></a><div class="logo"><span class="logo-orbit">✧</span> 四方生活 <small>WORLDS & DAYS</small></div><div class="header-right"><span class="build-badge">候选 UI · QA</span><button id="passport-button" class="ww-passport-hud" type="button" aria-label="打开四方旅行护照" title="旅行护照"><span class="ww-passport-trigger-icon" aria-hidden="true">✦</span></button></div></header><section id="lot-ui"><div class="lot-top"><div class="location-card"><span class="eyebrow" id="lot-country"></span><h1 id="lot-name"></h1><div><span id="game-time">10:00</span><span class="dot-separator">·</span><span id="floor-tag">室内与庭院</span></div><span id="player-health" role="status" hidden></span></div><div class="lot-tools"><button id="return-world" class="pill" aria-label="回到世界">◉ <span>回到世界</span></button><button id="roof-toggle" class="pill" aria-label="切换总览与人物视角" aria-pressed="false">⌂ <span>总览</span></button><button id="grid-toggle" class="pill" aria-label="显示或隐藏网格" aria-pressed="false">▦ <span>网格</span></button><button id="light-toggle" class="pill" aria-pressed="false" aria-label="切换到夜晚">☀ <span>夜晚</span></button></div></div>
<div class="character-card"><div class="portrait" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M8 64c1-17 12-23 24-23s24 6 24 23" fill="#5c9198" id="portrait-shirt"/><path d="M24 41h16l-8 11z" fill="#f1ddba"/><ellipse id="portrait-skin" cx="32" cy="27" rx="16" ry="19" fill="#d8a680"/><path d="M15 25C11 6 22 3 33 4s20 10 16 24l-5-9-8-3-7 8-8-7z" fill="#3b3230" id="portrait-hair"/><ellipse id="portrait-eye-left" cx="26" cy="28" rx="2.1" ry="2.8" fill="#34444a"/><ellipse id="portrait-eye-right" cx="39" cy="28" rx="2.1" ry="2.8" fill="#34444a"/><path d="M28 38q5 4 9-1" fill="none" stroke="#ad6758" stroke-width="1.5" stroke-linecap="round"/><ellipse cx="21" cy="34" rx="3" ry="1.6" fill="#d68b79"/><ellipse cx="44" cy="34" rx="3" ry="1.6" fill="#d68b79"/></svg></div><div><strong>旅居者</strong><span id="player-state">自在散步</span></div><button id="appearance-button" aria-label="人物与服装：试穿或随机人物">✿</button></div>
<div id="interaction" class="interaction" hidden><div id="activity-progress" hidden></div></div>
<div id="doorway-hint" class="doorway-hint" role="status" hidden>退后一步，让门打开</div><div class="movement-hint">W A S D 移动 <i>·</i> 拖动转动视角 <i>·</i> 点地面走过去</div><div id="joystick" class="joystick" aria-label="触屏移动摇杆"><div class="joystick-ring"></div><div id="joystick-knob"></div></div>
<div class="camera-tools"><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="缩小">−</button><button id="camera-reset" aria-label="回到人物视角">◎</button></div></section></template>
 <script type="module" src="./nearby-entry.js"></script>
</body>
</html>
